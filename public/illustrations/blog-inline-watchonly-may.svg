<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" fill="none" role="img" aria-label="Desktop can watch and prepare; the seed cannot enter the laptop">
  <rect width="960" height="360" rx="18" fill="#0b1218"/>
  <circle cx="200" cy="80" r="120" fill="#1ab79e" opacity="0.06"/>
  <circle cx="780" cy="300" r="140" fill="#c45c5c" opacity="0.05"/>

  <!-- Laptop body -->
  <g transform="translate(70 70)">
    <rect width="420" height="250" rx="18" fill="#1a2430" stroke="#3a4a5c" stroke-width="2"/>
    <rect x="18" y="18" width="384" height="190" rx="10" fill="#101820"/>
    <!-- screen glow: watching -->
    <circle cx="120" cy="90" r="36" fill="#12352f" stroke="#1ab79e" stroke-width="2"/>
    <!-- eye -->
    <ellipse cx="120" cy="90" rx="18" ry="10" stroke="#7dffe8" stroke-width="2"/>
    <circle cx="120" cy="90" r="4" fill="#7dffe8"/>
    <!-- chart -->
    <rect x="190" y="58" width="90" height="64" rx="8" fill="#152029" stroke="#2a3746"/>
    <path d="M204 106 L220 88 L236 96 L262 70" stroke="#1ab79e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- unsigned doc -->
    <rect x="300" y="58" width="70" height="64" rx="8" fill="#152029" stroke="#2a3746"/>
    <path d="M314 78 H356 M314 92 H348 M314 106 H340" stroke="#8b9aab" stroke-width="2" stroke-linecap="round"/>
    <text x="210" y="170" text-anchor="middle" fill="#6f8194" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="0.08em">WATCH - PREPARE - BROADCAST</text>
    <!-- laptop base -->
    <path d="M-10 250 H430 L450 270 H-30 Z" fill="#243140"/>
  </g>

  <!-- Barrier / force field between laptop and seed -->
  <g transform="translate(520 40)">
    <rect x="0" y="20" width="14" height="280" rx="7" fill="#c45c5c" opacity="0.85"/>
    <rect x="-18" y="120" width="50" height="50" rx="12" fill="#2a1518" stroke="#c45c5c" stroke-width="2"/>
    <!-- ban -->
    <circle cx="7" cy="145" r="14" stroke="#f0a0a0" stroke-width="2.5"/>
    <path d="M-3 155 L17 135" stroke="#f0a0a0" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Seed trying to enter - blocked -->
  <g transform="translate(580 90)">
    <path d="M0 90 H70" stroke="#c45c5c" stroke-width="2" stroke-dasharray="6 6" opacity="0.7"/>
    <path d="M10 80 L0 90 L10 100" fill="none" stroke="#c45c5c" stroke-width="2"/>
    <rect x="80" y="40" width="160" height="100" rx="14" fill="#1c1418" stroke="#c45c5c" stroke-width="1.5"/>
    <!-- seed dots as words -->
    <circle cx="110" cy="75" r="5" fill="#e8b4b4" opacity="0.8"/>
    <circle cx="130" cy="75" r="5" fill="#e8b4b4" opacity="0.55"/>
    <circle cx="150" cy="75" r="5" fill="#e8b4b4" opacity="0.8"/>
    <circle cx="170" cy="75" r="5" fill="#e8b4b4" opacity="0.45"/>
    <circle cx="190" cy="75" r="5" fill="#e8b4b4" opacity="0.7"/>
    <circle cx="120" cy="100" r="5" fill="#e8b4b4" opacity="0.5"/>
    <circle cx="140" cy="100" r="5" fill="#e8b4b4" opacity="0.75"/>
    <circle cx="160" cy="100" r="5" fill="#e8b4b4" opacity="0.4"/>
    <circle cx="180" cy="100" r="5" fill="#e8b4b4" opacity="0.65"/>
    <text x="160" y="130" text-anchor="middle" fill="#f0a0a0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700">SEED</text>
  </g>

  <!-- Device holding the key safely -->
  <g transform="translate(780 200)">
    <rect width="120" height="110" rx="16" fill="#121a22" stroke="#1ab79e" stroke-width="2"/>
    <rect x="18" y="16" width="84" height="58" rx="8" fill="#0a1814" stroke="#1ab79e"/>
    <!-- lock -->
    <rect x="48" y="38" width="24" height="18" rx="3" fill="#1ab79e" opacity="0.3" stroke="#1ab79e"/>
    <path d="M52 38 V32 a8 8 0 0 1 16 0 V38" stroke="#7dffe8" stroke-width="2" fill="none"/>
    <text x="60" y="96" text-anchor="middle" fill="#7dffe8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="750">ON DEVICE</text>
  </g>

  <text x="480" y="340" text-anchor="middle" fill="#6f8194" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">The laptop is an observatory - not a vault</text>
</svg>
