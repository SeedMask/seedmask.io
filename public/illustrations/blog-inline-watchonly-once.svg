<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" fill="none" role="img" aria-label="Typing the seed once spreads exposure to hot surfaces; you cannot rewind it">
  <rect width="960" height="280" rx="18" fill="#141018"/>

  <!-- One-way arrow path -->
  <path d="M70 140 H250" stroke="#c45c5c" stroke-width="3"/>
  <path d="M236 128 L250 140 L236 152" fill="#c45c5c"/>

  <!-- Seed origin -->
  <circle cx="70" cy="140" r="42" fill="#2a1518" stroke="#c45c5c" stroke-width="2"/>
  <text x="70" y="136" text-anchor="middle" fill="#f0a0a0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700">SEED</text>
  <text x="70" y="154" text-anchor="middle" fill="#e8b4b4" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">typed once</text>

  <!-- Hot surfaces cluster -->
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="280" y="48" width="150" height="64" rx="32" fill="#1c1418" stroke="#8a4a4a"/>
    <text x="355" y="86" text-anchor="middle" fill="#e8b4b4" font-size="14" font-weight="650">Cloud notes</text>

    <rect x="460" y="48" width="150" height="64" rx="32" fill="#1c1418" stroke="#8a4a4a"/>
    <text x="535" y="86" text-anchor="middle" fill="#e8b4b4" font-size="14" font-weight="650">Camera roll</text>

    <rect x="640" y="48" width="150" height="64" rx="32" fill="#1c1418" stroke="#8a4a4a"/>
    <text x="715" y="86" text-anchor="middle" fill="#e8b4b4" font-size="14" font-weight="650">Chat paste</text>

    <rect x="370" y="140" width="170" height="64" rx="32" fill="#1c1418" stroke="#8a4a4a"/>
    <text x="455" y="178" text-anchor="middle" fill="#e8b4b4" font-size="14" font-weight="650">Phone backups</text>

    <rect x="570" y="140" width="170" height="64" rx="32" fill="#1c1418" stroke="#8a4a4a"/>
    <text x="655" y="178" text-anchor="middle" fill="#e8b4b4" font-size="14" font-weight="650">Browser profile</text>
  </g>

  <!-- Cannot rewind -->
  <rect x="820" y="100" width="110" height="110" rx="16" fill="#0f161e" stroke="#1ab79e" stroke-width="1.5"/>
  <path d="M850 155 H900" stroke="#6f8194" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M860 145 L850 155 L860 165" fill="none" stroke="#6f8194" stroke-width="2"/>
  <text x="875" y="188" text-anchor="middle" fill="#7dffe8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="750">NO</text>
  <text x="875" y="204" text-anchor="middle" fill="#7dffe8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="750">REWIND</text>

  <text x="480" y="250" text-anchor="middle" fill="#8b9aab" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">One exception trains the same muscle - hot surfaces join the threat model</text>
</svg>
